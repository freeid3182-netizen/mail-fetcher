<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign in</title></head>
<body>
<!-- Where an expired session lands you. It is a different page with a different title, which
     is what lets `expect_host` and a title comparison catch a navigation nobody asked for. -->
<h1>Sign in to continue</h1>
<p>Your session has expired.</p>
<input id="user" type="text" aria-label="Username">
<button id="signin" type="button" aria-label="Sign in">Sign in</button>
</body>
</html>
