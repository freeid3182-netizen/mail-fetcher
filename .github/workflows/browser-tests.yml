# Phase 13 — the browser core's own tests, on the runtime that will actually run it.
#
# Separate from the mail workflows on purpose: it touches no mailbox, needs no secret, and must
# never be able to send anything. It is the standing proof that the core works on ubuntu-latest
# with managed Chromium, which is where the background worker runs. The local venv on the
# owner's machine is for iteration; THIS is the evidence.
name: browser-tests

on:
  push:
    paths:
      - 'browser/**'
      - '.github/workflows/browser-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Managed Chromium
        run: |
          python -m pip install --quiet playwright==1.49.1
          python -m playwright install --with-deps chromium
      - name: Targeted tests for the browser core and portal profiles
        run: python browser/test_browser.py
      - name: Keep the evidence when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-evidence
          path: browser/_test_downloads/
          if-no-files-found: ignore
