# PHASE 13 STEP 1 — CAN THIS RUNNER ACTUALLY DRIVE A BROWSER?
#
# A one-off feasibility probe, not part of the worker. It answers with evidence what the audit
# could otherwise only assume: whether Playwright and Chromium install and run here, what the
# install costs against the 10-30 minute budget the other workflows use, and -- the part that
# matters most -- whether "headed" on a CI runner is watchable by a person. It is not: headed
# works only under a virtual display (Xvfb), which no human can see. Reporting that honestly is
# the whole point, because execution rule 14 forbids calling this a browser on the owner's desk.
#
# workflow_dispatch ONLY. No secrets. No portal. One public page (example.com). Nothing is
# written back to the portal. Delete this file once the question is answered.
name: phase13-browser-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright and Chromium, and time it
        run: |
          echo "--- install begins: $(date -u +%H:%M:%S)"
          python -m pip install --quiet playwright==1.49.1
          python -m playwright install --with-deps chromium
          echo "--- install ends:   $(date -u +%H:%M:%S)"
          python -c "import playwright; print('playwright', playwright.__version__ if hasattr(playwright,'__version__') else 'installed')"

      - name: Is there a display a person could watch?
        run: |
          echo "DISPLAY=[${DISPLAY:-unset}]"
          which Xvfb xvfb-run || echo "no xvfb binary"
          echo "--- this is the evidence for the visible-mode claim, so print it plainly"

      - name: Headless Chromium against a public page
        run: python probe_browser.py

      - name: Headed Chromium, under a virtual display only
        run: xvfb-run -a python probe_browser.py --headed

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase13-probe-evidence
          path: |
            probe-*.png
            probe-*.txt
            probe-download/
          if-no-files-found: warn
