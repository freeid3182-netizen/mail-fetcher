name: Read attachments

# The third road, beside fetch.yml and archive.yml. The portal has no PDF library and no OCR,
# so the reading happens here — PyMuPDF for a text layer and RapidOCR offline for a scan, the
# same toolchain Phase 5I(C) used to read 1,552 documents.
#
# It sends back TEXT, never the bytes. A stranger's PDF is never parsed on the portal.
#
# Bounded on purpose: a pass reads a limited number of files and the next pass continues.
# Nothing is lost by stopping, and an attachment already read is not offered again.

on:
  schedule:
    - cron: '40 * * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: 'How many attachments to read this pass'
        required: false
        default: '40'

concurrency:
  group: read-attachments
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the readers
        # Pinned to the same families Phase 5I(C) used. RapidOCR carries its own ONNX model,
        # so nothing is downloaded at read time and no page ever leaves this runner.
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet \
            "PyMuPDF>=1.24,<2" \
            "rapidocr-onnxruntime>=1.3,<2" \
            "pillow>=10" \
            "numpy>=1.26,<3" \
            "openpyxl>=3.1,<4"

      - name: Read them
        env:
          PORTAL_URL: ${{ vars.PORTAL_URL }}
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
          MAILBOXES: ${{ secrets.MAILBOXES }}
          ATT_BATCH: ${{ github.event.inputs.batch || '40' }}
        run: python attachments.py
